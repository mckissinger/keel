name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The pin gate as its own required context — the server-side half of the
  # verified-pin control (references/milestones-and-verification.md §5).
  verified-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate's merge-base precondition (m1) fails closed on
          # shallow clones — the exact misconfiguration it exists to catch.
          fetch-depth: 0

      # The verified-pin gate keel ships to projects — prove it still behaves.
      - name: verified-pin gate self-test
        run: bash scripts/check-verified-pin.test.sh

      # The gate run against THIS repo's real PRs — keel eats its own gate.
      # pull_request only: on push to main there is no PR diff to judge.
      - name: verified-pin gate (this repo)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-verified-pin.sh HEAD

  # The plan lint as its own required context.
  plan-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plan lint keel ships to projects — prove it, and lint keel's own specs.
      - name: plan lint self-test
        run: bash scripts/check-plan.test.sh
      - name: plan lint (this repo)
        run: bash scripts/check-plan.sh

  # The remaining self-test battery — every step of the former monolithic job
  # that is not one of the named required contexts above.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Plan-only fast path (references/profile-interface.md Q11): a PR whose diff
      # touches only plan paths cannot affect these shell self-tests, so the remaining
      # steps early-exit. The step ABSORBS the classifier's exit code into an output —
      # a code diff (or a fail-closed classifier error) sets plan_only=false and NEVER
      # fails this step; the fail direction of an error is "run everything". The job
      # itself always runs and reports: never a job-level `if:`, never a `paths:`
      # filter on a required check (a required check that never reports wedges the
      # merge). pull_request only — a push to main has no PR diff to classify, and the
      # empty output makes every step run exactly as before.
      - name: classify diff (plan-only fast path)
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if bash scripts/check-verified-pin.sh --plan-only-check HEAD; then
            echo "plan_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "plan_only=false" >> "$GITHUB_OUTPUT"
          fi

      # The stack-neutral guard for keel's own corpus + its self-test.
      - name: neutrality guard self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-neutral.test.sh
      - name: neutrality guard (this repo)
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-neutral.sh

      # The git hooks keel ships to projects — prove they still behave.
      - name: session bootstrap hook self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/session-bootstrap.test.sh
      - name: merge guard hook self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/merge-guard.test.sh
      - name: branch-rules guard hook self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/guard-branch-rules.test.sh
      - name: attended-marker cross-script parity self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/attended-marker-parity.test.sh

      # The auto-run entry preflight keel ships to projects — prove it, incl. the
      # allow_auto_merge assertion (check d).
      - name: auto preflight self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-auto-preflight.test.sh

      # The branch-protection assertion keel:arm-auto-merge + preflight share — prove
      # it (wired with prep-auto-merge; keel runs tests by NAME, not a glob, so an
      # unwired test never runs — this is the floor this repo's arming trusts).
      - name: branch-protection assertion self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-branch-protection.test.sh
      # The prep-auto-merge scaffold artifacts — the security-review template stays a
      # valid review job with its SHA in lockstep with keel's own workflow, and the
      # generated names-only check-contract is certified.
      - name: prep-auto-merge scaffold self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-prep-auto-merge.test.sh

      # The skill-frontmatter lint keel ships to projects — prove it, and lint keel's own skills.
      - name: skill frontmatter lint self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-skill-frontmatter.test.sh
      - name: skill frontmatter lint (this repo)
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-skill-frontmatter.sh

      # The prose-anchor lint — load-bearing skill/agent sentences stay present.
      - name: skill anchors lint self-test
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-skill-anchors.test.sh
      - name: skill anchors lint (this repo)
        if: steps.classify.outputs.plan_only != 'true'
        run: bash scripts/check-skill-anchors.sh

      # Plugin manifest/structure validation via the Claude Code CLI. The npm
      # download cache is keyed per-run with a restore-keys prefix fallback:
      # every run restores the most recent cache and saves a fresh one, so the
      # cache tracks the CLI's latest version instead of pinning a stale tarball.
      - name: cache npm downloads (Claude Code CLI)
        if: steps.classify.outputs.plan_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-cli-${{ runner.os }}-${{ github.run_id }}
          restore-keys: npm-claude-cli-${{ runner.os }}-
      - name: install Claude Code CLI
        if: steps.classify.outputs.plan_only != 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: plugin validate
        if: steps.classify.outputs.plan_only != 'true'
        run: claude plugin validate --strict .

  # The autonomy tier's compensating control, live on keel itself: a real
  # per-PR security review behind the required check name, not a name alone
  # (decisions/2026-07-29-security-review-wiring.md; the recorded default).
  # PR-only: it reviews PR diffs; there is nothing to review on a push to main.
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pinned to a full commit SHA so a tag move cannot swap the action's code.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
